name: Bump msquic
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Determine versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          current=$(grep -oP '^ARG MSQUIC_VERSION=\K.+' Dockerfile)
          latest=$(gh api repos/microsoft/msquic/releases/latest --jq .tag_name)

          if [[ ! "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag format: $latest" >&2
            exit 1
          fi

          {
            echo "current=$current"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
      - name: Bump msquic
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: sed -i "s/^ARG MSQUIC_VERSION=.*/ARG MSQUIC_VERSION=$LATEST/" Dockerfile
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open bump PR
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        uses: firezone/actions/create-pull-request@f92afb7395591f2205bdcfd42b975c8dcf51bb6b # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/bump-msquic-${{ steps.versions.outputs.latest }}
          title: "chore: bump msquic to ${{ steps.versions.outputs.latest }}"
          body: "Update msquic from ${{ steps.versions.outputs.current }} to ${{ steps.versions.outputs.latest }}: https://github.com/microsoft/msquic/releases/tag/${{ steps.versions.outputs.latest }}"
          paths: Dockerfile
          reviewers: firezone/engineering
