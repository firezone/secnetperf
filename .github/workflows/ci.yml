name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    outputs:
      msquic_version: ${{ steps.version.outputs.msquic }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read pinned msquic version
        id: version
        run: echo "msquic=$(grep -oP '^ARG MSQUIC_VERSION=\K.+' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export static binary
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: binary
          outputs: type=local,dest=out
      - name: Prepare release assets
        working-directory: out
        run: |
          set -euo pipefail

          mv secnetperf secnetperf-x86_64-unknown-linux-gnu
          sha256sum secnetperf-x86_64-unknown-linux-gnu \
            > secnetperf-x86_64-unknown-linux-gnu.sha256sum.txt
      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secnetperf-linux-x86_64
          path: |
            out/secnetperf-x86_64-unknown-linux-gnu
            out/secnetperf-x86_64-unknown-linux-gnu.sha256sum.txt
          if-no-files-found: error
          retention-days: 1
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/firezone/secnetperf:latest
            ghcr.io/firezone/secnetperf:${{ steps.version.outputs.msquic }}

  windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read pinned msquic version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Dockerfile -Pattern '^ARG MSQUIC_VERSION=(.+)$'
          if (-not $match) {
            throw 'Could not find MSQUIC_VERSION in Dockerfile'
          }

          "msquic=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - name: Clone msquic
        shell: pwsh
        env:
          MSQUIC_VERSION: ${{ steps.version.outputs.msquic }}
        run: |
          git clone --depth 1 --branch $env:MSQUIC_VERSION https://github.com/microsoft/msquic msquic
          git -C msquic submodule update --init --depth 1 submodules/xdp-for-windows
      - name: Configure static Windows build
        shell: pwsh
        env:
          # msquic compiles its core with /analyze and /WX, and the MSVC
          # analyzer on the current runner image reports a C28020 false
          # positive in crypto_tls.c. Suppress that warning; CMake appends
          # CFLAGS to its default compiler flags at first configure.
          CFLAGS: /wd28020
        run: |
          cmake -S msquic -B msquic/build -A x64 `
            -DQUIC_BUILD_PERF=ON `
            -DQUIC_BUILD_SHARED=OFF `
            -DQUIC_STATIC_LINK_CRT=ON
      - name: Build secnetperf
        shell: pwsh
        run: cmake --build msquic/build --config Release --target secnetperf --parallel
      - name: Prepare release assets
        shell: pwsh
        run: |
          $asset = 'secnetperf-x86_64-pc-windows-msvc.exe'
          $source = 'msquic/build/bin/Release/secnetperf.exe'
          if (-not (Test-Path $source)) {
            throw "Could not find $source"
          }

          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item $source "out/$asset"
          $hash = (Get-FileHash "out/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Out-File "out/$asset.sha256sum.txt" -Encoding ascii
      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secnetperf-windows-x86_64
          path: |
            out/secnetperf-x86_64-pc-windows-msvc.exe
            out/secnetperf-x86_64-pc-windows-msvc.exe.sha256sum.txt
          if-no-files-found: error
          retention-days: 1

  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read pinned msquic version
        id: version
        run: echo "msquic=$(sed -nE 's/^ARG MSQUIC_VERSION=(.+)$/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: Clone msquic
        env:
          MSQUIC_VERSION: ${{ steps.version.outputs.msquic }}
        run: |
          git clone --depth 1 --branch "$MSQUIC_VERSION" https://github.com/microsoft/msquic msquic
          git -C msquic submodule update --init --depth 1 submodules/quictls
      - name: Configure static macOS build
        run: |
          cmake -S msquic -B msquic/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DQUIC_BUILD_PERF=ON \
            -DQUIC_BUILD_SHARED=OFF
      - name: Build secnetperf
        run: cmake --build msquic/build --config Release --target secnetperf --parallel
      - name: Verify standalone Apple Silicon binary
        run: |
          binary=msquic/build/bin/Release/secnetperf
          file "$binary"
          [[ $(lipo -archs "$binary") == arm64 ]]
          otool -L "$binary" | tee "$RUNNER_TEMP/secnetperf-dependencies.txt"
          awk 'NR > 1 && $1 !~ /^\/usr\/lib\// && $1 !~ /^\/System\/Library\// { exit 1 }' \
            "$RUNNER_TEMP/secnetperf-dependencies.txt"
      - name: Smoke test QUIC upload and download
        run: |
          set -euo pipefail
          binary="$PWD/msquic/build/bin/Release/secnetperf"
          "$binary" -bind:127.0.0.1:4433 -exec:maxtput -maxruntime:15000 > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" || true; cat "$RUNNER_TEMP/server.log"' EXIT
          ready=false
          for _ in {1..20}; do
            if lsof -nP -a -p "$server" -iUDP:4433; then ready=true; break; fi
            sleep 0.25
          done
          [[ "$ready" == true ]]
          for direction in up down; do
            "$binary" -target:127.0.0.1 -ip:4 -port:4433 -inctarget:0 \
              -exec:maxtput -conns:1 -streams:1 "-$direction:1s" \
              -pctput:1 -ptput:1 -maxruntime:5000 | tee "$RUNNER_TEMP/$direction.log"
            grep -E 'Result: (Upload|Download) [1-9][0-9]* bytes @ [1-9][0-9]* kbps' "$RUNNER_TEMP/$direction.log"
          done
      - name: Prepare release assets
        run: |
          mkdir -p out
          cp msquic/build/bin/Release/secnetperf out/secnetperf-aarch64-apple-darwin
          cd out
          shasum -a 256 secnetperf-aarch64-apple-darwin > secnetperf-aarch64-apple-darwin.sha256sum.txt
      - name: Upload macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secnetperf-macos-arm64
          path: |
            out/secnetperf-aarch64-apple-darwin
            out/secnetperf-aarch64-apple-darwin.sha256sum.txt
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref == 'refs/heads/main'
    needs:
      - linux
      - windows
      - macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: secnetperf-*
          path: out
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MSQUIC_VERSION: ${{ needs.linux.outputs.msquic_version }}
        run: |
          set -euo pipefail

          title="$MSQUIC_VERSION"
          notes="Standalone Linux and Windows x86-64 and macOS arm64 builds of secnetperf from msquic $MSQUIC_VERSION. Assets are refreshed from main and may change without a new tag. Built from $GITHUB_SHA."

          if gh release view "$MSQUIC_VERSION" >/dev/null 2>&1; then
            gh release edit "$MSQUIC_VERSION" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"

            gh release upload "$MSQUIC_VERSION" \
              out/secnetperf-x86_64-unknown-linux-gnu \
              out/secnetperf-x86_64-unknown-linux-gnu.sha256sum.txt \
              out/secnetperf-x86_64-pc-windows-msvc.exe \
              out/secnetperf-x86_64-pc-windows-msvc.exe.sha256sum.txt \
              out/secnetperf-aarch64-apple-darwin \
              out/secnetperf-aarch64-apple-darwin.sha256sum.txt \
              --clobber
          else
            gh release create "$MSQUIC_VERSION" \
              out/secnetperf-x86_64-unknown-linux-gnu \
              out/secnetperf-x86_64-unknown-linux-gnu.sha256sum.txt \
              out/secnetperf-x86_64-pc-windows-msvc.exe \
              out/secnetperf-x86_64-pc-windows-msvc.exe.sha256sum.txt \
              out/secnetperf-aarch64-apple-darwin \
              out/secnetperf-aarch64-apple-darwin.sha256sum.txt \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
